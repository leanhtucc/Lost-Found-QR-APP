<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lost and Found QR — Thiết kế UI chi tiết từng luồng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#08111F;--cv:#050B14;--sf:#0F1A2E;--sm:#162340;--se:#1C2B4A;--pr:#2B7FE8;--pd:#1D62C9;--pl:#7CC4FF;--sg:#FFB020;--ok:#2ECC8B;--er:#E5365B;--tx:#F1F6FF;--mu:#9AA9C2;--lb:#8394B0;--bd:rgba(255,255,255,.12)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cv);color:var(--tx);font-family:'Be Vietnam Pro',system-ui,sans-serif;line-height:1.5}
a{color:var(--pl)}
/* ---------- page chrome ---------- */
.wrap{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
nav.side{position:sticky;top:0;height:100vh;overflow:auto;padding:20px 14px;border-right:1px solid var(--bd);background:#07101D}
nav.side h1{font-size:15px;margin:0 0 4px}
nav.side .q{width:100%;height:40px;border-radius:12px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:0 12px;font:500 13px inherit;margin:12px 0}
nav.side a.g{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:10px;color:#C9D6EA;text-decoration:none;font-size:13px;font-weight:600}
nav.side a.g:hover{background:var(--sf)}
nav.side a.g b{width:22px;height:22px;border-radius:7px;background:var(--pr);color:#fff;display:grid;place-items:center;font-size:12px;flex:none}
nav.side a.g span{margin-left:auto;font-size:11px;color:var(--lb)}
nav.side small{display:block;color:var(--lb);font-size:11px;margin-top:14px;line-height:1.5}
main{padding:28px 32px 80px;min-width:0}
.hero h2{font-size:34px;line-height:1.15;margin:0 0 8px;letter-spacing:-.5px}
.hero p{color:var(--mu);max-width:820px;margin:0 0 16px}
section.sec{margin-top:56px}
section.sec>h3{font-size:26px;margin:0;display:flex;gap:12px;align-items:center}
section.sec>h3 b{width:36px;height:36px;border-radius:12px;background:var(--pr);display:grid;place-items:center;font-size:18px}
section.sec>.goal{color:var(--mu);margin:6px 0 14px;max-width:860px}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 22px}
.flow a{padding:6px 12px;border-radius:14px;background:var(--sf);border:1px solid var(--bd);color:#C9D6EA;text-decoration:none;font-size:12px;font-weight:600}
.flow a:hover{border-color:var(--pr);color:#fff}
.flow i{color:var(--lb);font-style:normal}
.sc{display:grid;grid-template-columns:330px minmax(0,1fr);gap:28px;padding:22px;border-radius:28px;background:#0B1426;border:1px solid var(--bd);margin-bottom:22px;scroll-margin-top:16px}
@media(max-width:1000px){.wrap{grid-template-columns:1fr}nav.side{position:static;height:auto}.sc{grid-template-columns:1fr}}
.scaler{width:312px;height:675px}
.scaler .phone{transform:scale(.8);transform-origin:0 0}
.st{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.st button,.tabs button,.rp{height:34px;padding:0 14px;border-radius:17px;border:1px solid var(--bd);background:var(--sf);color:#C9D6EA;font:600 12px 'Be Vietnam Pro',sans-serif;cursor:pointer}
.st button.on,.tabs button.on{background:var(--pr);border-color:var(--pr);color:#fff}
.rp{color:var(--pl);margin-top:10px}
.info{max-width:780px}
.info h4{font-size:22px;margin:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.info h4 em{font-style:normal;font-size:12px;font-weight:700;padding:3px 10px;border-radius:10px;background:var(--sm);color:var(--pl)}
.info h4 .ph3{background:rgba(255,176,32,.16);color:var(--sg)}
.info code{font:600 12px ui-monospace,Consolas,monospace;color:var(--pl);background:var(--sf);padding:3px 8px;border-radius:8px}
.info .d{color:var(--mu);margin:8px 0 14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.pane{display:none}.pane.on{display:block}
.pane ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.pane li{padding:10px 14px;border-radius:14px;background:var(--sf);border:1px solid var(--bd);font-size:14px;color:#D6E1F2}
.pane li b{color:#fff}
.pane li .m{display:inline-block;font:700 11px ui-monospace,Consolas,monospace;padding:2px 7px;border-radius:7px;margin-right:8px;background:rgba(43,127,232,.2);color:var(--pl)}
.pane li .m.g{background:rgba(46,204,139,.18);color:var(--ok)}.pane li .m.r{background:rgba(229,54,91,.2);color:#FF8CA2}.pane li .m.y{background:rgba(255,176,32,.2);color:var(--sg)}
.pane li small{display:block;color:var(--lb);margin-top:2px;font-size:12px}
/* design-system board */
.ds{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:14px 0}
.ds .c{border-radius:18px;border:1px solid var(--bd);overflow:hidden;background:var(--sf)}
.ds .c i{display:block;height:64px}.ds .c div{padding:10px 12px;font-size:12px;color:var(--mu)}.ds .c b{color:#fff;display:block;font-size:13px}
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin:10px 0}
.tbl th,.tbl td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--bd)}.tbl th{color:var(--lb);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
/* ---------- PHONE ---------- */
.phone{width:390px;height:844px;border-radius:44px;background:var(--bg);border:1px solid #22345A;position:relative;overflow:hidden;color:var(--tx);font-family:'Be Vietnam Pro',system-ui,sans-serif;box-shadow:0 30px 60px rgba(0,0,0,.45)}
.phone *{box-sizing:border-box}
.pg{position:absolute;inset:0;display:flex;flex-direction:column}
.glow{position:absolute;left:-60px;right:-60px;top:-60px;height:380px;background:radial-gradient(closest-side,rgba(43,127,232,.34),rgba(43,127,232,0));pointer-events:none}
.hdr{display:flex;align-items:center;gap:12px;padding:52px 16px 10px;position:relative}
.bk{width:44px;height:44px;border-radius:22px;background:var(--sf);border:1px solid var(--bd);display:grid;place-items:center;flex:none;color:var(--tx)}
.ttl{font-size:20px;font-weight:700;line-height:26px}.sub{font-size:12px;color:var(--mu)}
.grow{flex:1;min-width:0}
.bd{flex:1;overflow:hidden;padding:8px 16px 0;display:flex;flex-direction:column;gap:12px;position:relative}
.ft{padding:12px 16px 28px;border-top:1px solid var(--bd);background:var(--bg);position:relative;display:flex;flex-direction:column;gap:10px}
.h1{font-size:30px;line-height:38px;font-weight:700;letter-spacing:-.3px;margin:0}
.h2{font-size:22px;line-height:28px;font-weight:700;margin:0}
.p{font-size:15px;line-height:22px;color:var(--mu);margin:0}
.mu{color:var(--mu)}.lb{color:var(--lb)}.sm{font-size:13px;line-height:19px}.xs{font-size:12px;line-height:17px}.b7{font-weight:700}.b6{font-weight:600}
.k{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--lb);text-transform:uppercase}
.c{text-align:center}.ctr{display:flex;align-items:center;justify-content:center}
.hs{display:flex;align-items:center;gap:12px}.vs{display:flex;flex-direction:column;gap:12px}
.g4{gap:4px}.g8{gap:8px}.g16{gap:16px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mta{margin-top:auto}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;height:56px;border-radius:18px;background:linear-gradient(135deg,#2B7FE8,#1D62C9);color:#fff;font:700 17px 'Be Vietnam Pro',sans-serif;width:100%;border:0;text-decoration:none;position:relative}
.btn.sec{background:var(--sm);border:1px solid var(--bd);color:var(--tx);font-weight:600}
.btn.gh{background:transparent;border:1px solid rgba(255,255,255,.18);color:var(--tx);font-weight:600}
.btn.dng{background:var(--er)}.btn.sg{background:var(--sg);color:#050B14}.btn.dis{background:var(--se);color:var(--lb)}
.btn.s{height:44px;font-size:14px;border-radius:14px;width:auto;padding:0 16px;font-weight:700}
.btn.ld::after{content:"";width:20px;height:20px;border-radius:10px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .8s linear infinite}
.fld .l{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.fb{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 16px;border-radius:16px;background:var(--sf);border:1.5px solid rgba(255,255,255,.14);font-size:15px;font-weight:500}
.fb.f{border-color:var(--pr);background:var(--sm)}.fb.e{border-color:var(--er)}.fb.o{border-color:var(--ok)}.fb .ph{color:var(--lb)}
.fb .fi{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fb .caret{width:2px;height:20px;background:var(--pl);animation:blink 1s steps(1) infinite}
.fm{font-size:12px;color:var(--mu);margin-top:6px}.fm.e{color:#FF8CA2}.fm.o{color:var(--ok)}
.card{border-radius:24px;background:var(--sf);border:1px solid var(--bd);padding:16px}
.card.t{background:rgba(43,127,232,.1);border-color:rgba(43,127,232,.32)}.card.w{background:rgba(255,176,32,.1);border-color:rgba(255,176,32,.38)}.card.o{background:rgba(46,204,139,.1);border-color:rgba(46,204,139,.32)}.card.b{background:rgba(229,54,91,.1);border-color:rgba(229,54,91,.38)}
.card.sl{padding:12px 14px;border-radius:20px}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:14px;font-size:12px;font-weight:700;background:var(--se);color:#C9D6EA;border:1px solid var(--bd);white-space:nowrap}
.chip.p{background:rgba(43,127,232,.16);color:var(--pl);border-color:rgba(43,127,232,.35)}.chip.w{background:rgba(255,176,32,.16);color:var(--sg);border-color:rgba(255,176,32,.4)}.chip.o{background:rgba(46,204,139,.16);color:var(--ok);border-color:rgba(46,204,139,.35)}.chip.b{background:rgba(229,54,91,.16);color:#FF8CA2;border-color:rgba(229,54,91,.4)}
.fl{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 16px;border-radius:20px;background:var(--sf);border:1px solid var(--bd);font-size:13px;font-weight:600;color:#C9D6EA;white-space:nowrap}
.fl.on{background:var(--pr);border-color:var(--pr);color:#fff}
.row{display:flex;align-items:center;gap:14px;min-height:56px;padding:0 16px;font-size:15px;font-weight:500}
.sep{height:1px;background:rgba(255,255,255,.08);margin-left:66px}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:rgba(43,127,232,.16);color:var(--pl)}
.ico.l{width:56px;height:56px;border-radius:16px}.ico.w{background:rgba(255,176,32,.16);color:var(--sg)}.ico.o{background:rgba(46,204,139,.16);color:var(--ok)}.ico.b{background:rgba(229,54,91,.16);color:#FF8CA2}.ico.n{background:rgba(131,148,176,.16);color:var(--mu)}.ico.s{width:36px;height:36px;border-radius:11px}
.av{width:44px;height:44px;border-radius:22px;background:rgba(43,127,232,.2);display:grid;place-items:center;font-weight:700;color:var(--pl);flex:none;position:relative}
.av.l{width:88px;height:88px;border-radius:44px;font-size:34px;background:linear-gradient(135deg,#2B7FE8,#1D62C9);color:#fff}
.av .on{position:absolute;right:0;bottom:0;width:12px;height:12px;border-radius:6px;background:var(--ok);border:2px solid var(--sf)}
.sw{width:52px;height:32px;border-radius:16px;background:var(--se);position:relative;flex:none;transition:.2s;cursor:pointer}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:13px;background:#fff;transition:.2s}
.sw.on{background:var(--pr)}.sw.on::after{left:23px}.sw.on.w{background:var(--sg)}
.chk{width:24px;height:24px;border-radius:8px;border:1.5px solid rgba(255,255,255,.3);display:grid;place-items:center;flex:none;color:#fff}.chk.on{background:var(--pr);border-color:var(--pr)}
.scrim{position:absolute;inset:0;background:rgba(5,11,20,.72)}
.sheet{position:absolute;left:0;right:0;bottom:0;border-radius:32px 32px 0 0;background:var(--sf);border-top:1px solid var(--bd);padding:12px 16px 28px;display:flex;flex-direction:column;gap:12px}
.grab{width:44px;height:5px;border-radius:3px;background:#3A4B6E;margin:0 auto 4px}
.modal{position:absolute;left:20px;right:20px;top:50%;transform:translateY(-50%);border-radius:28px;background:var(--sf);border:1px solid var(--bd);padding:22px 20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 30px 60px rgba(0,0,0,.5)}
.toast{position:absolute;left:16px;right:16px;top:54px;padding:12px 16px;border-radius:16px;display:flex;gap:10px;align-items:center;font-size:14px;font-weight:600;background:var(--se);border:1px solid var(--bd);box-shadow:0 12px 28px rgba(0,0,0,.4);z-index:5}
.toast.o{border-color:rgba(46,204,139,.5)}.toast.b{border-color:rgba(229,54,91,.55)}.toast.w{border-color:rgba(255,176,32,.5)}
.ban{padding:10px 16px;font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center;justify-content:center;background:var(--er);color:#fff}
.ban.w{background:var(--sg);color:#050B14}.ban.n{background:var(--se);color:var(--tx)}
.tb{position:absolute;left:16px;right:16px;bottom:16px;height:72px;border-radius:26px;background:rgba(15,26,46,.96);border:1px solid rgba(43,127,232,.3);display:flex;align-items:center;padding:0 8px;box-shadow:0 12px 28px rgba(0,0,0,.4);z-index:3}
.tb .t{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--mu)}.tb .t.on{color:var(--pl)}
.tb .scanb{position:absolute;left:50%;top:-28px;margin-left:-32px;width:64px;height:64px;border-radius:32px;background:linear-gradient(135deg,#2B7FE8,#1D62C9);box-shadow:0 10px 22px rgba(43,127,232,.5);display:grid;place-items:center;border:4px solid var(--bg);color:#fff}
.tb .gap{width:76px}
.map{position:absolute;inset:0}
.pin{position:absolute;width:34px;height:34px;border-radius:17px 17px 17px 4px;transform:rotate(-45deg)}
.me-dot{position:absolute;width:26px;height:26px;border-radius:13px;background:var(--pr);border:4px solid #fff;box-shadow:0 0 0 10px rgba(43,127,232,.3)}
.fab{position:absolute;width:60px;height:60px;border-radius:30px;background:var(--pr);box-shadow:0 8px 20px rgba(43,127,232,.55);display:grid;place-items:center;color:#fff;z-index:2}
.prog{display:flex;gap:6px}.prog i{flex:1;height:4px;border-radius:2px;background:#22345A}.prog i.d{background:var(--ok)}.prog i.n{background:var(--pr)}
.dots{display:flex;gap:8px}.dots i{width:6px;height:6px;border-radius:3px;background:#2A3B5C;transition:.3s}.dots i.on{width:28px;background:var(--pr)}
.bub{max-width:78%;padding:12px 16px;font-size:15px;line-height:22px}
.bub.me{align-self:flex-end;border-radius:22px 22px 6px 22px;background:var(--pr);color:#fff}
.bub.th{align-self:flex-start;border-radius:22px 22px 22px 6px;background:var(--se);border:1px solid var(--bd)}
.sys{align-self:center;display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:16px;background:rgba(43,127,232,.1);border:1px solid rgba(43,127,232,.3);font-size:12px;font-weight:500;color:var(--pl);text-align:center}
.tm{font-size:11px;color:var(--lb);margin:-4px 4px 0}
.typing{align-self:flex-start;display:flex;gap:5px;padding:14px 16px;border-radius:22px 22px 22px 6px;background:var(--se)}.typing i{width:7px;height:7px;border-radius:4px;background:var(--mu);animation:blink2 1.2s infinite}.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
.otp{display:flex;gap:8px;justify-content:space-between}.otp .o{width:48px;height:60px;border-radius:14px;background:var(--sf);border:1.5px solid rgba(255,255,255,.18);display:grid;place-items:center;font-size:28px;font-weight:700}.otp .o.f{border-color:var(--pr);box-shadow:0 0 0 3px rgba(43,127,232,.3)}.otp .o.e{border-color:var(--er);animation:shake .4s}
.np{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.np button{height:52px;border-radius:14px;border:0;background:var(--sm);color:var(--tx);font:600 22px 'Be Vietnam Pro',sans-serif;cursor:pointer}.np button:active{background:var(--pr)}
.skel{background:linear-gradient(90deg,#12203A 25%,#1C2B4A 50%,#12203A 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:12px}
.hero-i{position:relative;height:230px;border-radius:28px;overflow:hidden;border:1px solid var(--bd);background:linear-gradient(135deg,#24406E,#162340)}
.rate{display:flex;gap:10px;justify-content:center}
.qr{background:#fff;border-radius:20px;padding:10px;display:inline-block}
/* ---------- ANIMATION ---------- */
.a{animation:fup .5s cubic-bezier(.2,.8,.2,1) both}
.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}.d4{animation-delay:.32s}.d5{animation-delay:.4s}.d6{animation-delay:.48s}
.a-pop{animation:pop .5s cubic-bezier(.2,.9,.3,1.3) both}
.a-up{animation:sheetup .38s cubic-bezier(.2,.8,.2,1) both}
.a-dn{animation:toastdn .35s cubic-bezier(.2,.8,.2,1) both}
.a-fade{animation:fin .4s ease both}
.a-float{animation:float 3s ease-in-out infinite}
.a-spin{animation:spin 1s linear infinite}
.a-shake{animation:shake .4s}
.ring{position:absolute;border-radius:50%;border:2px solid rgba(124,196,255,.55);animation:pulse 2.4s ease-out infinite}
.ring.r2{animation-delay:.8s}.ring.r3{animation-delay:1.6s}
.scanl{position:absolute;left:18px;right:18px;height:3px;border-radius:2px;background:linear-gradient(90deg,rgba(43,127,232,0),#7CC4FF,rgba(43,127,232,0));box-shadow:0 0 18px #2B7FE8;animation:scanl 2.2s ease-in-out infinite alternate}
.fillbar{height:100%;border-radius:2px;background:var(--pr);animation:fill 1.2s ease both}
.draw{stroke-dasharray:60;stroke-dashoffset:60;animation:draw .6s .2s ease forwards}
.pulse-dot{animation:glow 1.6s ease-in-out infinite}
@keyframes fup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fin{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes sheetup{from{transform:translateY(100%)}to{transform:none}}
@keyframes toastdn{from{opacity:0;transform:translateY(-24px)}to{opacity:1;transform:none}}
@keyframes pulse{0%{transform:scale(.4);opacity:.7}100%{transform:scale(1.5);opacity:0}}
@keyframes scanl{from{top:14%}to{top:86%}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}
@keyframes blink2{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes float{50%{transform:translateY(-6px)}}
@keyframes fill{from{width:0}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes glow{50%{box-shadow:0 0 0 8px rgba(46,204,139,0)}0%{box-shadow:0 0 0 0 rgba(46,204,139,.5)}}
@media(prefers-reduced-motion:reduce){.phone *{animation:none!important;transition:none!important}}
</style>
</head>

/* ===================== helpers ===================== */
const GROUPS=[],SCREENS=[];

const IC={

lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>',

 states:[{n:'Mời nâng cấp',h:page(`${logoGrad}<div class="ctr" style="flex:1;flex-direction:column;gap:14px;padding:0 24px;position:relative"><div class="ico l o a-pop" style="width:96px;height:96px;border-radius:48px">${ic('heart',44,'#2ECC8B')}</div><h1 class="h1 c a d2" style="font-size:26px">Bạn vừa giúp một người</h1><p class="p c a d3">Tạo tài khoản để giữ lại lịch sử, nhận điểm tin cậy và được ghi nhận mỗi lần giúp người khác.</p>${card(`<div class="vs g8" style="gap:10px">${[['award','Điểm tin cậy tăng sau mỗi lần trả đồ'],['gift','Nhận thưởng nếu chủ đồ đặt thưởng'],['shield','Dữ liệu của bạn vẫn được ẩn với người lạ']].map(([i,t])=>`<div class="hs">${ico(i,'s')}<span class="sm">${t}</span></div>`).join('')}</div>`,'t')}</div>${foot(btn('Tạo tài khoản bằng SĐT này')+btn('Để sau','gh'))}`)}],

 api:[API('POST','/api/auth/register (guestUpgrade:true)','{phoneNumber, otp, guestUserId} — hợp nhất user khách vào user thật.')],
 errs:[ERR('SĐT đã có tài khoản','Chuyển sang Đăng nhập với SĐT đó thay vì tạo mới.')],
 anim:[ANI('Biểu tượng','pop 500ms'),ANI('Danh sách lợi ích','fade-up so le 80ms')]});

group({id:'D',title:'Chat & Kiểm duyệt',goal:'Kênh 1-1 giữa chủ đồ và người nhặt, thời gian thực qua Stream Chat. Hiện tại màn hình chat vẫn là dữ liệu giả — đây là thiết kế đích của Phase 4, gồm cả trạng thái mất mạng, token hết hạn, kênh đóng và công cụ kiểm duyệt.',flow:['D1','D2','D3','D4']});

const convRow=(n,item,last,t,unread,on)=>`<div class="hs" style="padding:14px;border-radius:22px;background:var(--sf);border:1px solid ${unread?'rgba(43,127,232,.45)':'var(--bd)'}">${`<div class="av">${n[0]}${on?'<span class="on"></span>':''}</div>`}<div class="grow"><div class="hs" style="justify-content:space-between"><b style="font-size:15px">${n}</b><span class="xs lb">${t}</span></div><div class="xs" style="color:var(--pl);font-weight:600">${item}</div><div class="sm ${unread?'':'mu'}" style="${unread?'font-weight:600':''};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${last}</div></div>${unread?`<span style="min-width:22px;height:22px;border-radius:11px;background:var(--pr);font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 6px">${unread}</span>`:''}</div>`;
screen({id:'D1',group:'D',name:'Danh sách hội thoại',route:'TabNavigator › Chat (ChatList)',phase:'P4',
 desc:'Mỗi hội thoại gắn với một món đồ. Tên món đồ lấy từ metadata kênh (hiện đang gán cứng “Món đồ” — cần sửa). Chấm xanh lá = đang online.',
 states:[
  {n:'Có hội thoại',h:page(`${hdr('Tin nhắn','2 chưa đọc',false)}${body(`<div class="hs" style="gap:8px">${fl('Tất cả',1)}${fl('Chưa đọc')}${fl('Đang trả đồ')}</div>${convRow('Minh Anh','Ví da nâu','Ok, 18:30 mình có mặt nhé','2 phút',2,true)}${convRow('Khách 0988…','Chìa khóa xe','Mình thấy chìa khóa ở sảnh A','1 giờ',1,false)}${convRow('Hà My','Tai nghe','Cảm ơn bạn nhiều nhé!','Hôm qua',0,false)}`,'gap:10px')}${tabbar('Chat')}`)},
  {n:'Đang tải',h:page(`${hdr('Tin nhắn','',false)}${body(`<div class="skel" style="height:88px;border-radius:22px"></div><div class="skel" style="height:88px;border-radius:22px"></div><div class="skel" style="height:88px;border-radius:22px"></div>`,'gap:10px')}${tabbar('Chat')}`)},
  {n:'Chưa có tin nhắn',h:page(`${hdr('Tin nhắn','',false)}<div class="ctr" style="flex:1;flex-direction:column;gap:12px;padding:0 32px"><div class="ico l a-float" style="width:96px;height:96px;border-radius:30px">${ic('msg',44)}</div><h2 class="h2 c">Chưa có cuộc trò chuyện</h2><p class="p c">Khi ai đó nhặt được đồ của bạn, hoặc bạn nhặt đồ của người khác, cuộc trò chuyện sẽ xuất hiện ở đây.</p></div>${tabbar('Chat')}`)},
  {n:'Lỗi tải',h:page(`${hdr('Tin nhắn','',false)}<div class="ctr" style="flex:1;flex-direction:column;gap:12px;padding:0 32px"><div class="ico l b" style="width:88px;height:88px;border-radius:28px">${ic('wifioff',38)}</div><h2 class="h2 c">Không tải được tin nhắn</h2><p class="p c">Kiểm tra kết nối rồi thử lại.</p><div class="btn s" style="width:160px">Thử lại</div></div>${tabbar('Chat')}`)}
 ],
 logic:[L('Sắp xếp theo tin nhắn mới nhất; hội thoại có phiên trả đồ đang diễn ra được ghim kèm nhãn trạng thái.'),L('Kéo để làm mới (RefreshControl). Số chưa đọc cập nhật realtime từ Stream.'),L('Chạm một dòng → Chat {channelId,itemName,userName,returnSessionId}.'),L('Khách (guest) chỉ thấy đúng 1 hội thoại của phiên mình.')],
 api:[API('GET','/api/stream/channels','Inbox: [{id, receiver{name,image}, last_message, unread_count, created_at}]'),API('WS','Stream Chat','Cập nhật unread/last_message realtime.')],
 errs:[ERR('Token Stream hết hạn','Tự xin token mới (GET /api/stream/token) và nối lại, người dùng không thấy gì.'),ERR('Mạng lỗi','Khối lỗi + Thử lại, dữ liệu cũ vẫn hiện nếu có cache.')],
 anim:[ANI('Danh sách','fade-up so le 50ms/dòng'),ANI('Chấm unread','pop 200ms khi có tin mới'),ANI('Kéo làm mới','spinner theo cử chỉ, màu primary')]});

const chatHead=(sub='Đang nói chuyện về: Ví da nâu',online=true)=>`<div style="padding:52px 16px 10px;background:var(--sf);border-bottom:1px solid var(--bd)"><div class="hs"><div class="bk" style="background:var(--sm)">${ic('back')}</div><div class="av">M${online?'<span class="on"></span>':''}</div><div class="grow"><div class="hs b6" style="gap:6px;font-size:16px">Minh Anh<svg width="15" height="15" viewBox="0 0 24 24" fill="#8FD3FF"><path d="M12 2l2.4 2 3.1-.3 1 3 2.7 1.6-.8 3 .8 3-2.7 1.6-1 3-3.1-.3L12 22l-2.4-2-3.1.3-1-3L2.8 15.7l.8-3-.8-3L5.5 8l1-3 3.1.3Z"/></svg></div><div class="xs mu">${sub}</div></div><div class="mu" style="width:44px;height:44px;display:grid;place-items:center">${ic('dots')}</div></div></div>`;
const retCard=(step,t,s)=>`<div class="hs" style="margin:12px 16px 0;padding:12px 14px;border-radius:20px;background:rgba(43,127,232,.12);border:1px solid rgba(43,127,232,.35)"><div class="ico" style="background:var(--pr);color:#fff;border-radius:12px;width:40px;height:40px">${ic('pin',20,'#fff')}</div><div class="grow"><div class="b7" style="font-size:12px;color:var(--pl)">${step}</div><div class="b6" style="font-size:14px">${t}</div></div><div class="btn s" style="height:44px;font-size:13px">${s}</div></div>`;
const composer=(dis)=>`<div class="hs" style="padding:8px 12px 28px;border-top:1px solid var(--bd);background:var(--bg);align-items:flex-end;gap:8px"><div class="ico" style="width:48px;height:48px;border-radius:24px;background:var(--se);color:var(--mu)">${ic('image')}</div><div class="grow hs" style="min-height:48px;padding:0 16px;border-radius:24px;background:var(--sf);border:1px solid var(--bd)"><input class="cin" ${dis?'disabled':''} placeholder="${dis?'Cuộc trò chuyện đã đóng':'Nhập tin nhắn...'}" style="flex:1;min-width:0;height:46px;background:transparent;border:0;outline:0;color:var(--tx);font:500 15px 'Be Vietnam Pro',sans-serif"><span class="mu">${ic('smile')}</span></div><div class="ico csend" style="width:48px;height:48px;border-radius:24px;background:${dis?'var(--se)':'var(--pr)'};color:#fff;cursor:pointer">${ic('send',20,'#fff',2.2)}</div></div>`;
const msgs=`<div class="sys" style="align-self:center;background:transparent;border:0;color:var(--lb)">Hôm nay</div><div class="bub th">Chào bạn, mình thấy ví của bạn ở căng tin tầng 1.</div><div class="bub me">Trời ơi cảm ơn bạn nhiều! Trong ví có thẻ sinh viên PTIT đúng không ạ?</div><div class="bub th">Đúng rồi, thẻ tên Lê Anh Tú. Bạn gặp mình ở đâu tiện nhất?</div>`;
const chatBody=(x='',t='')=>`<div class="chatlog" style="flex:1;overflow:hidden;padding:14px 16px 0;display:flex;flex-direction:column;gap:8px;justify-content:flex-end">${msgs}${x}${t}</div>`;
screen({id:'D2',group:'D',name:'Chat 1-1 + tiến độ trả đồ',route:'Chat {channelId,itemName,userName,returnSessionId}',phase:'P4',
 desc:'Tin nhắn thật qua Stream (thay INITIAL_MESSAGES + setTimeout). Thẻ tiến độ ghim phía trên điều khiển cả luồng trả đồ. Thử gõ và bấm gửi ở trạng thái “Mặc định” để xem hoạt ảnh.',
 states:[
  {n:'Mặc định (thử gõ được)',h:page(`${chatHead()}${retCard('BƯỚC 1 / 5 · TRÒ CHUYỆN','Chưa có điểm hẹn','Hẹn gặp')}${chatBody()}${composer()}`)},
  {n:'Đối phương đang gõ',h:page(`${chatHead()}${retCard('BƯỚC 1 / 5 · TRÒ CHUYỆN','Chưa có điểm hẹn','Hẹn gặp')}${chatBody('','<div class="typing"><i></i><i></i><i></i></div>')}${composer()}`)},
  {n:'Đã đề xuất điểm hẹn',h:page(`${chatHead()}${retCard('BƯỚC 2 / 5 · ĐỀ XUẤT ĐIỂM HẸN','Cổng ĐH Bách Khoa · 18:30','Xem')}${chatBody(`<div class="sys">${ic('pin',14,'#7CC4FF',2.2)}Tú đã đề xuất điểm hẹn: Cổng ĐH Bách Khoa, 18:30</div><div class="bub th">Ok, 18:30 mình có mặt nhé</div><div class="tm">18:02</div>`)}${composer()}`)},
  {n:'Mất mạng — đang nối lại',h:page(`<div class="ban w" style="padding-top:44px">${ic('wifioff',15)}Mất kết nối — đang thử lại…</div>${chatHead()}${chatBody(`<div class="bub me" style="opacity:.6">Mình tới cổng rồi nhé<span class="xs" style="display:block;margin-top:4px">${ic('clock',11)} Đang gửi…</span></div>`)}${composer()}`)},
  {n:'Gửi thất bại',h:page(`${chatHead()}${chatBody(`<div class="bub me" style="background:rgba(229,54,91,.25);border:1px solid var(--er)">Mình tới cổng rồi nhé</div><div class="hs" style="align-self:flex-end;gap:10px"><span class="xs" style="color:#FF8CA2">Chưa gửi được</span><span class="b7 xs" style="color:var(--pl);padding:12px 4px">Thử lại</span><span class="b7 xs mu" style="padding:12px 4px">Xoá</span></div>`)}${composer()}`)},
  {n:'Kênh đã đóng (chỉ đọc)',h:page(`${chatHead('Đã hoàn tất trả đồ',false)}${chatBody(`<div class="sys">${ic('shieldck',14,'#7CC4FF',2.2)}Phiên hoàn trả đã hoàn tất</div>`)}<div class="hs" style="padding:12px 16px 28px;border-top:1px solid var(--bd);gap:12px"><span class="mu">${ic('lock',16)}</span><span class="xs mu grow">Cuộc trò chuyện chuyển sang chế độ chỉ đọc.</span><span class="btn s sec" style="height:40px;font-size:12px">Xem biên lai</span></div>`)}
 ],
 logic:[L('<b>Gỡ hoàn toàn mock</b>: không còn INITIAL_MESSAGES, không còn setTimeout giả phản hồi. Lịch sử lấy từ channel.watch(), tin mới qua event message.new.'),L('<b>Thẻ tiến độ</b> (ReturnProgressCard) đọc ReturnSession.status từ store và đổi nhãn/nút: Hẹn gặp → Xem điểm hẹn → Mở bản đồ → Bàn giao → Biên lai → Đánh giá.'),L('Tin hệ thống (đề xuất/chấp nhận điểm hẹn) do <b>server</b> phát vào kênh để cả hai bên đều thấy; không tự chèn ở client.'),L('Gửi lạc quan: tin hiện ngay mờ + “Đang gửi…”, thành công thì sáng lên; thất bại hiện Thử lại/Xoá.'),L('Khi COMPLETED/CANCELLED: composer bị khoá, hiện dải chỉ đọc + nút xem biên lai.'),L('Gọi điện chỉ dùng SĐT hiện trong LiveMap sau khi hai bên chấp nhận điểm hẹn — chat không hiển thị số.')],
 api:[API('WS','Stream Chat: channel.watch / sendMessage / typing.*','Token từ GET /api/stream/token (người dùng) hoặc POST /api/guest/stream-token (khách), có TTL.'),API('GET','/api/stream/channels/:id','Metadata kênh: tên món đồ, thành viên.'),API('PUT','/api/stream/channels/:id/close','Đóng kênh — backend kiểm tra người gọi là thành viên (Phase 1).'),API('GET','/v1/returns/by-channel/:channelId','Lấy ReturnSession của kênh để vẽ thẻ tiến độ.')],
 errs:[ERR('Token hết hạn (401 từ Stream)','Im lặng làm mới token, nối lại; chỉ hiện banner nếu quá 5 giây.'),ERR('Mất mạng','Banner vàng “Mất kết nối”; tin chưa gửi nằm trong hàng đợi và tự gửi khi có mạng.'),ERR('Bị cấm/khoá chat (mute/ban)','Composer khoá + dòng “Bạn đã bị tạm khoá chat trong kênh này”.'),ERR('Tin quá 1000 ký tự','Bộ đếm đỏ, nút gửi tắt.')],
 anim:[ANI('Tin mới','fade-up 250ms (translateY 14→0); tin của mình trượt từ phải'),ANI('Đang gõ','3 chấm nhảy 1.2s, so le 0.2s'),ANI('Thẻ tiến độ','khi đổi bước: cross-fade 200ms + thanh tiến độ lấp đầy 400ms'),ANI('Gửi','nút gửi nhún .95→1 trong 120ms; haptic nhẹ')]});

 {n:'Chọn lý do báo cáo',h:page(`${chatHead()}${chatBody()}`+sheet(`<h2 class="h2" style="font-size:20px">Lý do báo cáo</h2>${['Spam hoặc quảng cáo','Lừa đảo / đòi tiền không đúng','Quấy rối, lăng mạ','Chia sẻ thông tin cá nhân','Khác'].map((t,i)=>`<div class="hs" style="min-height:52px;padding:0 4px"><span class="chk ${i===1?'on':''}" style="border-radius:12px">${i===1?ic('check',14,'#fff',3):''}</span><span class="grow" style="font-size:15px">${t}</span></div>`).join('')}${btn('Gửi báo cáo')}`))},
 {n:'Đã báo cáo',h:page(`${toast('Đã gửi báo cáo. Cảm ơn bạn đã giúp cộng đồng an toàn hơn.','o','check')}${chatHead()}${chatBody()}${composer()}`)}],

 api:[API('POST','/api/stream/messages/:id/flag','{reason,detail?}'),API('DEL','/api/stream/messages/:id/flag','Rút lại báo cáo.'),API('POST','/api/stream/channels/:id/mute/:userId','Khoá người trong kênh.'),API('DEL','/api/stream/channels/:id/mute/:userId','Mở khoá.'),API('POST','/api/stream/channels/:id/ban/:userId','Chỉ moderator/admin.')],

function render(){
  const side=document.getElementById('side'),app=document.getElementById('app');
  side.innerHTML=`<h1>Lost and Found QR</h1><small style="margin:0">Thiết kế UI chi tiết · ${SCREENS.length} màn · ${SCREENS.reduce((a,s)=>a+s.states.length,0)} trạng thái</small><input class="q" id="q" placeholder="Tìm màn hình…" aria-label="Tìm màn hình"><a class="g" href="#ds"><b>★</b>Hệ thiết kế</a>${GROUPS.map(g=>`<a class="g" href="#grp-${g.id}"><b>${g.id}</b>${g.title}<span>${SCREENS.filter(s=>s.group===g.id).length}</span></a>`).join('')}<a class="g" href="#plan"><b>⌁</b>Kế hoạch đóng gói</a><small>Mỗi màn: bấm các nút trạng thái để xem UI khác nhau, “Phát lại animation” để xem chuyển động, và các tab Logic · API · Lỗi · Animation. Thử bấm số ở màn E5 và gõ tin nhắn ở màn D2.</small>`;
  let h=`<div class="hero"><h2>Thiết kế UI đầy đủ — từng luồng, từng trạng thái</h2><p>Bản vẽ này dựa trên code hiện có (routes, API, máy trạng thái ReturnSession, audit Phase 3) và kế hoạch đóng gói APK. Mỗi màn có giao diện tương tác, hoạt ảnh, logic xử lý, API và các trường hợp lỗi. Nhãn <b style="color:var(--sg)">Pn</b> cho biết màn đó thuộc phase nào của kế hoạch.</p><div class="flow">${Object.entries(PH).map(([k,v])=>`<a style="pointer-events:none"><b style="color:var(--sg)">${k}</b> ${v}</a>`).join('')}</div></div>`;
  h+=DS;
  GROUPS.forEach(g=>{
    const list=SCREENS.filter(s=>s.group===g.id);
    h+=`<section class="sec" id="grp-${g.id}"><h3><b>${g.id}</b>${g.title}</h3><p class="goal">${g.goal}</p><div class="flow">${list.map((s,i)=>`<a href="#${s.id}">${s.id} · ${s.name}</a>${i<list.length-1?'<i>→</i>':''}`).join('')}</div>${g.extra||''}`;
    list.forEach(s=>{
      h+=`<article class="sc" id="${s.id}" data-name="${esc((s.id+' '+s.name+' '+s.route).toLowerCase())}"><div><div class="st">${s.states.map((st,i)=>`<button data-s="${s.id}" data-i="${i}" class="${i===0?'on':''}">${st.n}</button>`).join('')}</div><div class="slot" id="slot-${s.id}">${phoneHTML(s.states[0].h)}</div><button class="rp" data-r="${s.id}">↻ Phát lại animation</button></div><div class="info"><h4><em>${s.id}</em>${s.name}${s.phase?`<em class="ph3">${s.phase}</em>`:''}</h4><div style="margin-top:6px"><code>${esc(s.route)}</code></div><p class="d">${s.desc}</p><div class="tabs" data-t="${s.id}"><button class="on" data-p="0">Logic</button><button data-p="1">API & dữ liệu</button><button data-p="2">Lỗi & ngoại lệ</button><button data-p="3">Animation</button></div><div class="pane on" data-pn="${s.id}-0"><ul>${(s.logic||[]).join('')}</ul></div><div class="pane" data-pn="${s.id}-1"><ul>${(s.api||[]).join('')}</ul></div><div class="pane" data-pn="${s.id}-2"><ul>${(s.errs||[]).join('')}</ul></div><div class="pane" data-pn="${s.id}-3"><ul>${(s.anim||[]).join('')}</ul></div></div></article>`;
    });
    h+='</section>';
  });
  h+=MAP;
  app.innerHTML=h;
  document.getElementById('q').addEventListener('input',e=>{const v=e.target.value.toLowerCase().trim();document.querySelectorAll('article.sc').forEach(a=>{a.style.display=!v||a.dataset.name.includes(v)?'':'none';});});
}
function setState(id,i){const s=SCREENS.find(x=>x.id===id);document.getElementById('slot-'+id).innerHTML=phoneHTML(s.states[i].h);const ph=document.querySelector('#slot-'+id+' .phone');if(s.states[i].demo)ph.dataset.demo=s.states[i].demo;document.querySelectorAll(`.st button[data-s="${id}"]`).forEach((b,k)=>b.classList.toggle('on',k===i));document.getElementById(id).dataset.cur=i;}
/* ---------- delegated interactions ---------- */
document.addEventListener('click',e=>{
  const t=e.target;
  const sb=t.closest('.st button');if(sb){setState(sb.dataset.s,+sb.dataset.i);return;}
  const rp=t.closest('.rp');if(rp){const id=rp.dataset.r;setState(id,+(document.getElementById(id).dataset.cur||0));return;}
  const tb=t.closest('.tabs button');if(tb){const id=tb.parentNode.dataset.t;tb.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===tb));document.querySelectorAll(`[data-pn^="${id}-"]`).forEach(p=>p.classList.toggle('on',p.dataset.pn===id+'-'+tb.dataset.p));return;}
  const tg=t.closest('[data-tgl]');if(tg&&tg.closest('.phone')){tg.classList.toggle('on');if(tg.classList.contains('sw'))tg.setAttribute('aria-checked',tg.classList.contains('on'));return;}
  const pw=t.closest('[data-pw]');if(pw&&pw.closest('.phone')){pw.style.color=pw.style.color?'':'#7CC4FF';return;}
  const cs=t.closest('.csend');if(cs){chatSend(cs.closest('.phone'));return;}
  const nk=t.closest('.np button[data-k]');if(nk){handoverKey(nk.closest('.phone'),nk.dataset.k);return;}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('cin')){chatSend(e.target.closest('.phone'));}});
function chatSend(ph){
  const inp=ph.querySelector('.cin'),log=ph.querySelector('.chatlog');if(!inp||inp.disabled||!log)return;
  const v=inp.value.trim();if(!v)return;inp.value='';
  log.insertAdjacentHTML('beforeend',`<div class="bub me a">${esc(v)}</div>`);
  setTimeout(()=>{log.insertAdjacentHTML('beforeend','<div class="typing a-fade" data-ty><i></i><i></i><i></i></div>');},500);
  setTimeout(()=>{log.querySelectorAll('[data-ty]').forEach(n=>n.remove());log.insertAdjacentHTML('beforeend','<div class="bub th a">Mình đã nhận được rồi nhé. (Phản hồi minh hoạ)</div>');},1900);
}
const handoverState=new WeakMap();
function handoverKey(ph,k){
  let st=handoverState.get(ph);if(!st){st={code:'',left:5,locked:false};handoverState.set(ph,st);}
  if(st.locked)return;
  const boxes=ph.querySelectorAll('.otp .o'),att=ph.querySelector('.att');
  if(k==='⌫'){st.code=st.code.slice(0,-1);}else if(st.code.length<6){st.code+=k;}
  boxes.forEach((b,i)=>{b.textContent=st.code[i]||'';b.classList.remove('e','f');if(i===st.code.length&&st.code.length<6)b.classList.add('f');});
  if(st.code.length===6){
    if(st.code==='481092'){
      ph.innerHTML=`<div class="pg"><div class="glow"></div><div class="ctr" style="flex:1;flex-direction:column;gap:14px;padding:0 28px;position:relative"><div class="a-pop" style="width:112px;height:112px;border-radius:56px;background:rgba(46,204,139,.16);display:grid;place-items:center;box-shadow:0 0 0 14px rgba(46,204,139,.08)"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#2ECC8B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path class="draw" d="M20 6 9 17l-5-5"/></svg></div><h1 class="h1 c a d2" style="font-size:26px">Đã nhận lại đồ</h1><p class="p c a d3">Mã đúng. Hệ thống đang chuyển trạng thái sang Đã hoàn trả.</p></div></div>`;
    }else{
      st.left--;boxes.forEach(b=>b.classList.add('e'));
      if(st.left<=0){st.locked=true;if(att)att.innerHTML='<span style="color:#FF8CA2">Đã nhập sai 5 lần — mã bị khoá. Hãy mở tranh chấp.</span>';}
      else if(att)att.innerHTML=`<span style="color:#FF8CA2">Mã chưa đúng · còn ${st.left} lần thử</span>`;
      setTimeout(()=>{st.code='';boxes.forEach(b=>{b.textContent='';b.classList.remove('e')});},700);
    }
  }
}
render();
</script>
